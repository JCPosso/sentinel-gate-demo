name: Sentinel Architect gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  sentinel-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout this app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Sentinel Architect (private repo)
        uses: actions/checkout@v4
        with:
          repository: JCPosso/sentinel-architect
          # Repo privado: necesita un PAT de solo lectura, nunca el GITHUB_TOKEN
          # por defecto (ese solo alcanza al repo donde corre el workflow).
          token: ${{ secrets.SENTINEL_REPO_PAT }}
          path: sentinel-architect

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Sentinel's dependencies
        working-directory: sentinel-architect
        run: npm ci

      - name: Run the real Sentinel pipeline against this app
        working-directory: app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # NVIDIA_API_KEY fuera: la cuenta de NVIDIA está rota (404 "Function
          # not found for account", no es nuestro bug — ver commit 9deb50d en
          # sentinel-architect). selectLlmCaller la revisa antes que OpenRouter
          # en prioridad, así que dejarla pasar aquí volvería a elegirla.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Prueba real de que las reglas custom también funcionan en CI/CD,
          # no solo en la CLI local — mismo mecanismo, una variable de entorno.
          SENTINEL_CUSTOM_RULES: sentinel-rules.json
        # continue-on-error a propósito: esto es una demo, no un gate real de
        # producción — el objetivo es mostrar el pipeline corriendo y dejar el
        # dashboard descargable, no bloquear el merge.
        continue-on-error: true
        run: npx tsx ../sentinel-architect/src/cli.ts . hexagonal sentinel-output

      - name: Upload the generated dashboard as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-dashboard
          path: app/sentinel-output/

      - name: Comment the report summary on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node app/scripts/format-pr-comment.cjs app/sentinel-output/report.json "$RUN_URL" > /tmp/pr-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/pr-comment.md
